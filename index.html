<html lang="vi">

        <title>KBHelper</title>
    </head>
    <body>
        <div id="main1">
            <label for="command" class="nlabel">Enter command</label>

        </div>
        <label for="foutput" class="nlabel">OUTPUT</label>
        <textarea id="foutput" readonly rows="5"></textarea>
        <script></script>
    </body>
