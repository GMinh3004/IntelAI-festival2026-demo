<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />
        <script src="script.js" defer></script>
        <title>KBHelper</title>
    </head>
    <body>
        <div id="main1">
            <label for="command" class="nlabel">Enter command</label>
            <textarea id="command"
                placeholder="Internet not connect" rows="2"
                cols="10"></textarea>
            <button id="requestb" class="abutton">Ask KBHelper</button>
            <button id="scanos" class="abutton">Auto find bugs</button>
            <div id="hint">
                <p id="kchat"></p>
                <div id="helpcmd">
                    <p id="kcmd"></p>
                    <button id="cpcmd">Copy</button>
                </div>
            </div>
            <br>
        </div>
        <div id="fcli">
            <label for="foutput" class="nlabel">OUTPUT</label>
            <div>
                <button id="cpA" class="bcli">Copy All</button>
                <button id="clear" class="bcli">Clear</button>
            </div>
        </div>
        <textarea id="foutput" readonly rows="7"></textarea>
    </body>
</html>
